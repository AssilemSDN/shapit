# shapit.yml

version: 1

rules:
  - id: readme
    type: structure
    parameters:
      path: 'README.{md,txt}'

  - id: package
    type: structure
    parameters:
      path: package.json
      kind: file

  - id: tests
    type: structure
    parameters:
      path: tests
      kind: directory

  - id: no-env
    type: structure
    parameters:
      path: .env
      must: not_exist
