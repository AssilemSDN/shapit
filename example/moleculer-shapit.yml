# shapit.yml

# Example for a Node.js project powered by Moleculer.js, generated by Moleculer-gen.

# sources file to extract values
sources:
  services:
    file: .moleculer-gen/config.json
    format: json
    select: "$.services.*"

# rules definition
rules:
  # package.json schema
  - id: package-dependencies
    type: json-schema
    source:
      file: package.json
      format: json
    parameters:
      schema:
        type: object
        required: ["dependencies"]
  # services files
  - id: services-files
    each:
      source: services
      as: service
      id: "{{ service.serviceName }}"
    type: structure
    parameters:
      path: "src/services/{{service.serviceDirectoryName}}/{{service.serviceFileName}}"
      path_type: file
      file_extension: [".ts", ".js"]
      required: true
  # models files
  - id: models-files
    each:
      source: services
      as: service
      id: "{{ service.serviceName }}"
      filter:
        property: isCrud
        equals: true
    type: structure
    parameters:
      path: "src/models/{{service.modelFileName}}"
      path_type: file
      file_extension: [".ts", ".js"]
      required: true
