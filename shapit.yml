version: 1

rules:
  - id: package
    type: structure
    parameters:
      path: package.json
      kind: file

  - id: license
    type: structure
    parameters:
      path: LICENSE
      kind: file

  - id: documentation
    type: structure
    parameters:
      path: docs/usage.md
      kind: file

  - id: source
    type: structure
    parameters:
      path: src
      kind: directory

  - id: tests
    type: structure
    parameters:
      path: tests
      kind: directory

  - id: forbidden-lockfiles
    type: structure
    description: Only Yarn lockfiles are allowed
    parameters:
      path: '{package-lock.json,npm-shrinkwrap.json,pnpm-lock.yaml,pnpm-lock.yml,bun.lock,bun.lockb}'
      must: not_exist

  - id: yarn-lockfile
    type: structure
    description: Yarn lockfile must exist
    parameters:
      path: yarn.lock
      kind: file
      must: exist

  - id: package-files
    type: structure
    source:
      type: json
      file: package.json
      select: '$.files[*]'
      as: publishedPath
    parameters:
      path: '{{ publishedPath }}'
      must: exist

  - id: package-entrypoint
    type: structure
    source:
      type: json
      file: package.json
      select: '$.main'
      as: entrypoint
    parameters:
      path: '{{ entrypoint }}'
      kind: file
      must: exist

  - id: package-types
    type: structure
    source:
      type: json
      file: package.json
      select: '$.types'
      as: declarations
    parameters:
      path: '{{ declarations }}'
      kind: file
